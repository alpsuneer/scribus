# Scribus built-in updater: serves ONLY /srv/scribus-updates, read-only, no
# directory listing. Office PCs fetch <url>/latest.json and the .deb it names.
# The release signing key lives in ~/scribus-keys and is never under this root.
server {
	listen 8081 default_server;
	listen [::]:8081 default_server;
	server_name _;
	root /srv/scribus-updates;
	autoindex off;
	default_type application/octet-stream;
	# latest.json changes with every release: never let a proxy cache it.
	add_header Cache-Control "no-cache" always;
	location = / { return 404; }
	location ~ /\. { return 404; }
	location / { try_files $uri =404; }
	access_log /var/log/nginx/scribus-updates.access.log;
}
