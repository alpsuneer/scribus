# Scribus built-in updater: the HOST nginx on the Debian update server serves
# ONLY /srv/scribus-updates, read-only, on its own port 8095 (the ports 80/443
# there belong to the newsroom workflow's docker containers and are never
# touched). Office PCs fetch <url>/latest.json and the .deb it names.
# Installed as /etc/nginx/sites-available/scribus-updates (enabled, default
# site disabled). The release signing key is never under this root.
server {
	listen 8095 default_server;
	listen [::]:8095 default_server;
	server_name _;
	autoindex off;
	default_type application/octet-stream;
	types {
		application/vnd.debian.binary-package  deb;
		application/json                       json;
		application/pgp-signature              sig;
		text/plain                             sha256 txt;
	}
	location = /scribus-updates/latest.json {
		alias /srv/scribus-updates/latest.json;
		add_header Cache-Control "no-store" always;
	}
	location /scribus-updates/ {
		alias /srv/scribus-updates/;
		location ~ /\. { return 404; }
		try_files $uri =404;
	}
	location / { return 404; }
	access_log /var/log/nginx/scribus-updates.access.log;
}
